  <body>
    <div id="root"></div>
    <script>
      // Rete di sicurezza: se l'app non parte (errore, file aperto con doppio clic, programma non avviato) si vede
      // un messaggio chiaro invece di una pagina bianca.
      (function () {
        function box(title, body) {
          var root = document.getElementById("root");
          if (!root || root.children.length) return;
          root.innerHTML = '<main style="max-width:38rem;margin:2rem auto;padding:1rem;font-family:sans-serif">' +
            '<div style="border:1px solid #d5dbe3;background:#fff;padding:1.25rem"><h1 style="font-size:1.1rem;margin:0 0 .75rem">' + title + '</h1>' + body + '</div></main>';
        }
        function esc(t) { return String(t).replace(/</g, "&lt;"); }
        function needsServer() { return location.protocol === "file:" && !!document.querySelector('script[type="module"][src]'); }
        function fileBox() {
          box("Stai aprendo il file nel modo sbagliato",
              '<p style="font-size:.9rem">L\'app non si apre con un doppio clic sul file. Va avviata dal terminale:</p>' +
              '<ol style="font-size:.9rem;line-height:1.7"><li>Apri il terminale nella cartella del progetto</li><li>Scrivi <code>npm install</code> e premi Invio</li>' +
              '<li>Scrivi <code>npm run dev</code> e premi Invio</li><li>Apri nel browser l\'indirizzo che compare (di solito <code>http://localhost:5173</code>)</li></ol>');
        }
        function failed(msg) {
          if (needsServer()) return fileBox();
          box("L'app non è partita",
            '<p style="font-size:.85rem;color:#b91c1c;word-break:break-word;font-family:monospace">' + esc(msg) + '</p>' +
            '<p style="font-size:.85rem">Controlla il file <code>.env</code>, poi ferma il programma (Ctrl+C) e riavvialo con <code>npm run dev</code>.</p>');
        }
        window.addEventListener("error", function (e) { setTimeout(function () { failed(e.message || "errore nel caricamento di un file"); }, 300); }, true);
        window.addEventListener("unhandledrejection", function (e) { setTimeout(function () { failed((e.reason && e.reason.message) || e.reason); }, 300); });
        setTimeout(function () {
          if (needsServer()) {
            fileBox();
          } else {
            box("L'app non si è avviata",
              '<p style="font-size:.9rem">Dopo alcuni secondi non è comparso nulla. Prova:</p>' +
              '<ol style="font-size:.9rem;line-height:1.7"><li>Premi <b>Ctrl+F5</b> per ricaricare</li>' +
              '<li>Controlla che nel terminale <code>npm run dev</code> sia ancora in funzione e non mostri errori in rosso</li>' +
              '<li>Premi <b>F12</b>, apri «Console» e leggi l\'errore in rosso</li></ol>');
          }
        }, 4000);
      })();
    </script>
